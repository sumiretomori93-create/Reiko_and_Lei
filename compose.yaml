services:
  archive:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      PUBLIC_READ: ${PUBLIC_READ:-true}
      DATA_DIR: /data
    volumes:
      - archive-data:/data
    restart: unless-stopped
volumes:
  archive-data:
